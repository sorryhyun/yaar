name: Release Version Bump

# When a DRAFT release is saved/edited, sync the project version to the draft's
# tag and commit it to the target branch. By the time the maintainer clicks
# "Publish", the tag GitHub creates already points at a commit whose
# package.json / README / openapi.yaml carry the right version — so the built
# artifacts and the tag never disagree. Publishing then triggers release.yml.
on:
  release:
    types: [created, edited]

permissions:
  contents: write

jobs:
  bump:
    # Only act on drafts. Editing an already-published release must not re-bump.
    if: github.event.release.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target branch
        id: target
        env:
          COMMITISH: ${{ github.event.release.target_commitish }}
        run: |
          # A draft can target a branch name or a raw SHA. We can only commit to
          # a branch; bail out (without failing) if it's a SHA.
          if git check-ref-format --normalize "refs/heads/$COMMITISH" >/dev/null 2>&1 \
             && ! printf '%s' "$COMMITISH" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "branch=$COMMITISH" >> "$GITHUB_OUTPUT"
          else
            echo "branch=" >> "$GITHUB_OUTPUT"
            echo "::warning::Draft targets '$COMMITISH' (not a branch); skipping version bump."
          fi

      - uses: actions/checkout@v4
        if: steps.target.outputs.branch != ''
        with:
          ref: ${{ steps.target.outputs.branch }}
          # Use GITHUB_TOKEN; pushes with it do NOT re-trigger workflows (no loop).
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        if: steps.target.outputs.branch != ''

      - run: bun install --frozen-lockfile
        if: steps.target.outputs.branch != ''

      - name: Bump version files
        if: steps.target.outputs.branch != ''
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          bun run set-version "$TAG"
          bun run generate:openapi

      - name: Commit if changed
        if: steps.target.outputs.branch != ''
        env:
          TAG: ${{ github.event.release.tag_name }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          if git diff --quiet; then
            echo "Version already in sync with $TAG; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): set version to ${TAG#v}"
          git push origin "HEAD:$BRANCH"
