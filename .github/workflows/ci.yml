name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so doc-freshness can compare commit timestamps

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Build shared
        run: bun run --filter @yaar/shared build

      - name: Build compiler
        run: bun run --filter @yaar/compiler build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run --filter '*' test

      # Warns when a reference doc's **Source:** file changed after the doc's last
      # update. Broken pointers and bundled-library list drift still fail the check.
      # Run `bun run check:docs:strict` when stale-source warnings should also fail.
      - name: Check doc freshness
        run: bun run check:docs
