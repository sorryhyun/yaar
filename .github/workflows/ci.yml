name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # Baseline gate only (`full` defaults to false) — the same steps this workflow
  # ran inline before checks.yml existed. The heavier release-only checks are
  # added by release.yml so the per-push loop stays fast.
  check:
    uses: ./.github/workflows/checks.yml
