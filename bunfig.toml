# Root `bun test`. Bun picks bunfig.toml by *current directory*, so this file is
# what a test run launched from the repo root gets — and until it existed, such a
# run got no preload at all: the environment was the developer's, and results were
# silently wrong rather than red. Every package has its own bunfig for runs whose
# cwd is inside the package (what `bun run test` and CI use); this is the root's
# equivalent, and it exists to make `bun test <path>` from here mean the same thing
# the package's own run means — or, where it cannot, to say so instead of guessing.

[test]
# Preloads run in order, awaited, before any test file loads. `test/env.ts` must
# stay first — it pins the environment before `config/env.ts` can freeze
# `IS_REMOTE` from settings.json or .env. `test/preload-root.ts` then loads
# whatever setup the *anchored package* needs on top; see its header for why that
# cannot simply be "load everything".
#
# `test/partition-guard.ts` covers what neither of those can. A preload can fix an
# environment; it cannot split a process, and some test files must not share one —
# `bun test packages/server` from here reported 86 failures against a green tree
# because it put the remote suite, the mocking files, and the socket-bound suites
# in a single process. The guard refuses such a run and names the command that
# works, so a repo-wide `bun test` from the root is now an error rather than a
# wrong answer. Use `bun run test`, which is also what CI runs.
preload = [
  "./scripts/test/env.ts",
  "./scripts/test/preload-root.ts",
  "./scripts/test/partition-guard.ts",
]

# Build output is not a test suite. `tsc` emits `dist/**/*.test.js` alongside the
# real sources, so a path-scoped run collected each compiler test twice — once from
# `src`, once from a stale compiled copy — and the copies failed. That is why the
# package scripts scope collection by hand (`bun test src/tests`); ignoring the
# build output instead makes the unscoped form correct too, so
# `bun test packages/compiler` from here now matches `bun run test` exactly:
# 14 files, not 28. The pattern is written per-tree rather than per-package on
# purpose — it covers every `tsc`-built package (shared, lib, compiler) and any
# future one without being edited.
pathIgnorePatterns = ["**/dist/**", "**/node_modules/**"]

# `bun fmt` — `bun run format`, lint-staged, and Dev Tools' format action
# (`packages/server/src/features/dev/format.ts` reads the style keys below).
[fmt]
semi = true
singleQuote = true
trailingComma = "all"
tabWidth = 2
printWidth = 100
# Gitignore semantics: an entry with no leading `/` matches at any depth, so
# `storage/` and `config/` also skip `packages/server/src/{storage,config}/` and
# `features/config/` — carried over unchanged from the old `.prettierignore`.
ignorePatterns = [
  "dist/",
  "node_modules/",
  "bun.lock",
  "*.md",
  "*.json",
  "packages/server/src/lib/bundled-types/",
  "storage/",
  "config/",
  "packages/server/src/providers/codex/generated/",
  "packages/frontend/src/styles/base/tokens.css",
  "hosts/android/app/src/main/assets/yaar-host.js",
  # Artboard fragments: the canvas renders these literally, and one of them is a
  # terminal transcript inside `white-space: pre-wrap`, which reflowing rewrites.
  "scripts/codegen/design-screens/",
]
