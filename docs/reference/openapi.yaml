openapi: '3.1.0'
info:
  title: YAAR Server API
  description: REST API for the YAAR reactive AI interface server.
  version: 0.17.2
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /api/apps:
    get:
      summary: List all installed apps
      responses:
        '200':
          description: '`{ apps: AppInfo[] }`'
          content:
            application/json:
              schema:
                type: object
  /api/apps/{appId}/{path}:
    parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        schema:
          type: string
    get:
      summary: App static files
      responses:
        '200':
          description: file
          content:
            application/json:
              schema:
                type: object
  /api/auth/google/login:
    post:
      summary: Start Google sign-in — opens the consent screen (host + system apps only).
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /api/auth/google/logout:
    post:
      summary: Forget the local Google session (host + system apps only).
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /api/auth/google/me:
    get:
      summary: The publisher identity + owned app ids from the marketplace (host + system apps only).
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /api/auth/google/status:
    get:
      summary: Google sign-in status (host + bundled system apps only).
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /api/bridge:
    post:
      summary: "Observe/manage the user's real browser tabs via the YAAR Bridge extension"
      responses:
        '200':
          description: json
          content:
            application/json:
              schema:
                type: object
  /api/browser:
    post:
      summary: Execute browser action
      responses:
        '200':
          description: json
          content:
            application/json:
              schema:
                type: object
  /api/browser/sessions:
    get:
      summary: List open browser sessions
      responses:
        '200':
          description: json
          content:
            application/json:
              schema:
                type: object
  /api/browser/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Close a browser session
      responses:
        '200':
          description: json
          content:
            application/json:
              schema:
                type: object
  /api/browser/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: SSE stream for browser session updates
      responses:
        '200':
          description: text/event-stream
          content:
            application/json:
              schema:
                type: object
  /api/browser/{id}/screencast:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: 'Live screencast frames out, raw user input in (pre-P0 spike)'
      responses:
        '200':
          description: websocket
          content:
            application/json:
              schema:
                type: object
  /api/browser/{id}/screenshot:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Capture browser screenshot
      responses:
        '200':
          description: image/webp
          content:
            application/json:
              schema:
                type: object
  /api/dev/bundled-libraries:
    get:
      summary: List bundled libraries
      responses:
        '200':
          description: json
          content:
            application/json:
              schema:
                type: object
  /api/dev/compile:
    post:
      summary: Compile a project
      responses:
        '200':
          description: json
          content:
            application/json:
              schema:
                type: object
  /api/dev/deploy:
    post:
      summary: Deploy a project
      responses:
        '200':
          description: json
          content:
            application/json:
              schema:
                type: object
  /api/dev/format:
    post:
      summary: "Format a file's source text"
      responses:
        '200':
          description: json
          content:
            application/json:
              schema:
                type: object
  /api/dev/git-checkpoint:
    post:
      summary: "Snapshot an app's current state"
      responses:
        '200':
          description: json
          content:
            application/json:
              schema:
                type: object
  /api/dev/git-diff:
    post:
      summary: Diff an app against a snapshot or the host repo
      responses:
        '200':
          description: json
          content:
            application/json:
              schema:
                type: object
  /api/dev/git-history:
    post:
      summary: "List an app's version history"
      responses:
        '200':
          description: json
          content:
            application/json:
              schema:
                type: object
  /api/dev/git-restore:
    post:
      summary: Roll an app back to an earlier commit
      responses:
        '200':
          description: json
          content:
            application/json:
              schema:
                type: object
  /api/dev/typecheck:
    post:
      summary: Typecheck a project
      responses:
        '200':
          description: json
          content:
            application/json:
              schema:
                type: object
  /api/fetch:
    post:
      summary: 'Proxy HTTP request (for CORS-blocked APIs). Requires an iframe token; apps must declare `yaar://http`. Body: `{ url, method?, headers?, body? }`'
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /api/ml-runtime/{file}:
    parameters:
      - name: file
        in: path
        required: true
        schema:
          type: string
    get:
      summary: 'onnxruntime-web runtime artifacts (wasm/mjs) for @bundled/yaar-ml'
      responses:
        '200':
          description: file
          content:
            application/json:
              schema:
                type: object
  /api/ml-weights:
    get:
      summary: 'Streaming proxy for ML model weights (same-origin, no base64)'
      responses:
        '200':
          description: file
          content:
            application/json:
              schema:
                type: object
  /api/ml-weights/download:
    post:
      summary: 'Download a weight file to storage/. Body: `{ url, dest }`. Resumable.'
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
    get:
      summary: 'Progress of a weight download: `{ state, loaded, total }`'
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /api/pdf/{path}/{page}:
    parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Render PDF page as PNG
      responses:
        '200':
          description: image/png
          content:
            application/json:
              schema:
                type: object
  /api/storage:
    get:
      summary: Storage root (list/read)
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /api/storage/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Read a storage file / List directory contents
      responses:
        '200':
          description: file
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Write a storage file (body = file content)
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
    delete:
      summary: Delete a storage file
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /api/verb:
    post:
      summary: 'Execute a yaar:// verb from an iframe app. Body: `{ verb, uri, payload? }`, where an invoke `payload` may be an array of payloads to run against the same URI in order (stops at the first failure). One URI per call — brace expansion is MCP-only and is refused here. Restricted to allowed URI prefixes.'
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /api/verb/subscribe:
    post:
      summary: 'Subscribe/unsubscribe to reactive verb URI updates. Body: `{ uri, action: "subscribe" | "unsubscribe", subscriptionId?, mode?: "change" | "stream", kinds?: string[] }`. `mode: "stream"` pushes typed frames with payloads instead of bare change pings.'
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /api/version:
    get:
      summary: Running YAAR version and build shape
      responses:
        '200':
          description: '`{ version, bundled, platform, arch }`'
          content:
            application/json:
              schema:
                type: object
