<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: var(--font-sans); font-size: var(--text-base); line-height: 1.5; position: relative; overflow: hidden; background-color: var(--color-mantle); background-image: linear-gradient(color-mix(in srgb, var(--color-accent) 5%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--color-accent) 5%, transparent) 1px, transparent 1px); background-size: 26px 26px; display: flex; flex-direction: column; color: var(--color-text);">

  <div style="height: 58px; flex-shrink: 0;"></div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 14px; row-gap: 26px; padding: 0 22px; margin-top: 24px; opacity: 0.78;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-xl); background: var(--color-surface); border: 1px solid var(--color-border); color: {{accent}};">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      </div>
      <span style="font-size: var(--text-xs); color: var(--color-subtext);">Storage</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-xl); background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-subtext-muted);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c2.6 2.8 2.6 15.2 0 18"></path><path d="M12 3c-2.6 2.8-2.6 15.2 0 18"></path></svg>
      </div>
      <span style="font-size: var(--text-xs); color: var(--color-subtext);">Browser</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-xl); background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-subtext-muted);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M15 3v4h4"></path><path d="M9.5 12h6"></path><path d="M9.5 16h4"></path></svg>
      </div>
      <span style="font-size: var(--text-xs); color: var(--color-subtext);">Memo</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-xl); background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-subtext-muted);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 8-5 4 5 4"></path><path d="m15 8 5 4-5 4"></path></svg>
      </div>
      <span style="font-size: var(--text-xs); color: var(--color-subtext);">Dev Tools</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-xl); background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-subtext-muted);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m15.6 15.6 4.4 4.4"></path></svg>
      </div>
      <span style="font-size: var(--text-xs); color: var(--color-subtext);">Search</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-xl); background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-subtext-muted);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h10"></path></svg>
      </div>
      <span style="font-size: var(--text-xs); color: var(--color-subtext);">Logs</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-xl); background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-subtext-muted);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 15h18"></path></svg>
      </div>
      <span style="font-size: var(--text-xs); color: var(--color-subtext);">Dock</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-xl); background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-subtext-muted);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"></path><path d="M9 8a3 3 0 0 1 6 0"></path></svg>
      </div>
      <span style="font-size: var(--text-xs); color: var(--color-subtext);">Market</span>
    </div>

  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; gap: 8px; align-self: flex-start; margin: 0 0 10px 16px; padding: 5px 12px 5px 8px; border: 1px solid var(--color-border); border-radius: var(--radius-full); background: var(--bg-glass-strong);">
    <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: var(--radius-full); border: 2px solid var(--yaar-wash-accent-border); border-top-color: {{accent}};"></span>
    <span style="font-size: var(--text-sm); color: var(--color-subtext);">Monitor 1 · Running Bash</span>
    <span style="font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-muted);">18s</span>
  </div>

  <div style="padding: 0 8px 22px;">
    <div style="border: 1px solid var(--color-border-hover); border-radius: var(--radius-xl); background: var(--bg-glass-strong); box-shadow: var(--shadow-lg);">

      <div style="display: flex; align-items: center; justify-content: center; height: 24px;">
        <span aria-hidden="true" style="width: 36px; height: 4px; border-radius: var(--radius-full); background: var(--color-border-hover);"></span>
      </div>

      <div style="display: flex; align-items: flex-end; gap: 8px; padding: 0 8px 8px;">

        <button type="button" aria-label="Reset windows and context" style="flex-shrink: 0; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--color-border); border-radius: var(--radius-full); background: var(--color-surface); color: var(--color-subtext-muted); cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>
        </button>

        <label for="ask" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Ask the agent anything</label>
        <textarea id="ask" rows="3" style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 8px; border: none; border-radius: var(--radius-md); background: transparent; color: var(--color-text); font-family: inherit; font-size: max(16px, var(--text-base)); line-height: 1.45; resize: none; outline: none;">Three days in Tokyo — hotel is in Shinjuku, flights are booked. Put the plan somewhere I can edit it.</textarea>

        <button type="button" style="flex-shrink: 0; height: 36px; padding: 0 16px; border: none; border-radius: var(--radius-full); background: var(--color-accent-emphasis); color: var(--color-text); font-family: inherit; font-size: var(--text-base); font-weight: 600; cursor: pointer;">Send</button>

      </div>

      <div style="padding: 0 12px 10px 56px; font-size: var(--text-xs); color: var(--color-muted);">Enter to send · Shift+Enter for a new line · Esc to cancel</div>

    </div>
  </div>

</div>
